<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Dataverse Load</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", system-ui, sans-serif; }
    body { margin: 0; padding: 12px; font-size: 13px; }
    h1 { font-size: 16px; margin: 0 0 8px 0; }
    label { display: block; font-weight: 600; margin-top: 10px; margin-bottom: 4px; }
    select, input, button { font: inherit; padding: 4px 6px; box-sizing: border-box; width: 100%; }
    button { background: #0078d4; color: white; border: 0; padding: 6px 10px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    button.secondary { background: #f3f3f3; color: #111; border: 1px solid #ccc; }
    button.icon { width: auto; padding: 4px 8px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .mapping-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 4px; padding: 2px 0; }
    .mapping-row select, .mapping-row input { padding: 2px 4px; }
    .lookup-cfg { display: flex; gap: 4px; padding: 0 0 4px 12px; }
    .lookup-cfg > * { flex: 1; min-width: 0; }
    .opts-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; }
    .opts-grid label { margin: 0; font-weight: 500; font-size: 12px; }
    .opts-grid .check { display: flex; align-items: center; gap: 6px; grid-column: 1 / span 2; }
    .opts-grid .check input { width: auto; }
    .status { margin-top: 10px; padding: 6px; border-radius: 4px; }
    .status.info { background: #eef6ff; color: #003a75; }
    .status.error { background: #fde7e9; color: #5c0011; }
    .status.success { background: #e9f7ee; color: #0a3d1e; }
    .progress { background: #eee; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .progress > div { background: #0078d4; height: 100%; width: 0%; transition: width 0.2s; }
    hr { margin: 12px 0; border: 0; border-top: 1px solid #e5e5e5; }
  </style>
</head>
<body>
  <h1>Load to Dataverse</h1>

  <label>Saved environments</label>
  <div class="row">
    <select id="profile" style="flex:1"></select>
    <button id="profileDelete" class="secondary icon" type="button" title="Remove selected profile">✕</button>
  </div>

  <label for="env">Environment URL</label>
  <input id="env" placeholder="https://contoso.crm.dynamics.com" />
  <div id="profileSaveRow" class="row" style="margin-top:4px; display:none;">
    <input id="profileName" placeholder="Name this environment…" style="flex:1" />
    <button id="profileSaveConfirm" type="button" style="width:auto;">Save</button>
    <button id="profileSaveCancel" class="secondary icon" type="button">Cancel</button>
  </div>
  <div style="margin-top:4px;">
    <button id="profileSaveBtn" class="secondary" type="button" style="font-size:11px;">Save as profile…</button>
  </div>

  <div class="row" style="margin-top: 6px;">
    <button id="signin" class="secondary" type="button">Sign in</button>
    <span id="authDot" style="font-size:16px; line-height:1;">&#9679;</span>
    <span id="who" style="font-size: 12px; color: #555;"></span>
  </div>

  <hr />

  <label for="table">Source table</label>
  <select id="table"><option value="">Loading…</option></select>

  <label for="entity">Target Dataverse entity</label>
  <select id="entity" disabled><option value="">Sign in to load entities</option></select>

  <label>Column mapping</label>
  <div id="mappings"></div>
  <div class="row" style="margin-top: 6px;">
    <button id="addMap" class="secondary" type="button">Add column</button>
    <button id="suggest" class="secondary" type="button" title="Suggest mappings by header name similarity">
      Suggest from names
    </button>
  </div>

  <hr />

  <label>Import options</label>
  <div class="opts-grid">
    <label for="conflictMode">On existing rows</label>
    <select id="conflictMode">
      <option value="insert">Insert only</option>
      <option value="upsert">Upsert (update or create)</option>
      <option value="skip-if-exists">Skip if exists</option>
      <option value="sync">Sync (upsert + remove missing)</option>
    </select>

    <label for="upsertKey" id="upsertKeyLabel" style="display:none">Upsert key attribute(s)</label>
    <input id="upsertKey" placeholder="e.g. emailaddress1 (comma-separate for compound keys)" style="display:none" />

    <label for="syncAction" id="syncActionLabel" style="display:none">Missing records</label>
    <select id="syncAction" style="display:none">
      <option value="deactivate">Deactivate (statecode = 1)</option>
      <option value="delete">Delete permanently</option>
    </select>

    <label for="batchSize">Batch size</label>
    <input id="batchSize" type="number" min="1" max="1000" value="100" />

    <label for="concurrency">Parallel batches</label>
    <input id="concurrency" type="number" min="1" max="8" value="1" />

    <div class="check">
      <input id="bypassCustomLogic" type="checkbox" />
      <label for="bypassCustomLogic">Bypass plugins &amp; Power Automate flows (needs bypass privilege)</label>
    </div>
    <div class="check">
      <input id="skipUnchanged" type="checkbox" />
      <label for="skipUnchanged">Skip unchanged rows (upsert/sync; one extra read per row)</label>
    </div>
  </div>

  <hr />

  <div class="row">
    <button id="save" class="secondary" type="button">Save mapping…</button>
    <button id="load" class="secondary" type="button">Load mapping…</button>
    <button id="importPqt" class="secondary" type="button" title="Import queries + field mappings from a Dataverse Dataflow / Power Query Online .pqt export">Import .pqt…</button>
    <button id="run" type="button" style="margin-left: auto;">Run import</button>
  </div>
  <div id="pqtRow" class="row" style="margin-top:6px; display:none;">
    <select id="pqtQuery" style="flex:1"></select>
    <button id="pqtUse" type="button" style="width:auto;">Use mapping</button>
    <button id="pqtCopyM" class="secondary" type="button" style="width:auto;"
            title="Copy the M code to paste into Excel: Data → Get Data → Blank Query → Advanced Editor">Copy M</button>
  </div>

  <div id="status" class="status info" style="display:none"></div>
  <div id="progressWrap" style="display:none">
    <div class="progress"><div id="progressBar"></div></div>
    <div id="progressText" style="font-size:12px; color:#555; margin-top:4px;"></div>
  </div>
  <div id="logWrap" style="display:none; margin-top:6px;">
    <button id="downloadLog" class="secondary" type="button">Download log…</button>
    <div id="errorDetails" style="display:none; margin-top:4px; max-height:140px; overflow-y:auto;
         font-size:11px; font-family:monospace; white-space:pre-wrap;
         background:#fde7e9; color:#5c0011; padding:6px; border-radius:4px;"></div>
  </div>
</body>
</html>
