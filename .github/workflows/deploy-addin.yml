name: Deploy add-in to GitHub Pages

# Builds the Excel add-in (production mode) and publishes packages/addin/dist
# to GitHub Pages at https://powerplatformprofessor.github.io/dvload/.
#
# One-time repo setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "packages/addin/**"
      - "packages/core/**"
      - ".github/workflows/deploy-addin.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=@dvload/core

      - name: Build add-in (production)
        run: npx webpack --mode production
        working-directory: packages/addin
        env:
          # The only build-time input the add-in bundle actually has (see
          # webpack.config.js DefinePlugin). Unset means empty, which turns
          # telemetry off.
          #
          # DATAVERSE_LOAD_CLIENT_ID is deliberately NOT passed here: since
          # the UI moved behind the local sidecar it never talks to Entra, so
          # there is no client id to bake in. The CLI reads that variable at
          # runtime instead.
          DVLOAD_AI_CONNECTION_STRING: ${{ vars.DVLOAD_AI_CONNECTION_STRING }}

      - name: Include production manifest
        run: cp packages/addin/manifest.prod.xml packages/addin/dist/manifest.prod.xml

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/addin/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
